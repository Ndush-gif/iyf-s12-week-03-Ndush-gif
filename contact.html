    <main>
        <h1>Contact Me</h1>
        <p>Feel free to reach out to me using the form below:</p>

        <div class="contact-layout">
            <form class="contact-form" action="#" method="post">
                <fieldset>
                    <legend>Contact Form</legend>
                    <p>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" placeholder="Your Full Name" required>
                    </p>
                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="You@example.com" required>
                    </p>
                    <p>
                        <label for="phone">Phone (optional):</label>
                        <input type="tel" id="phone" name="phone" placeholder="e.g. 07912 345 678">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Message</legend>
                    <p>
                        <label for="subject">Subject:</label>
                        <select id="subject" name="subject" required>
                            <option value="">--Please choose an option--</option>
                            <option value="general">General Inquiry</option>
                            <option value="support">Support Request</option>
                            <option value="feedback">Feedback</option>
                        </select>
                    </p>
                    <p>
                        <label for="message">Your Message:</label>
                        <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your Message here (at least 50 characters)" required></textarea>
                    </p>
                    <p>
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        <label for="newsletter" class="inline-label">Subscribe to our newsletter</label>
                    </p>
                </fieldset>

                <button type="submit">Submit</button>
            </form>

            <aside class="contact-sidebar">
                <section>
                    <h2>Find Me Online</h2>
                    <ul>
                        <li><a href="https://github.com/Ndush-gif" target="_blank" rel="noopener noreferrer">GitHub</a></li>
                    </ul>
                    <p>Email: <a href="mailto:ndukucatherine211@gmail.com">ndukucatherine211@gmail.com</a></p>
                </section>

                <section>
                    <h2>Location</h2>
                    <p>Based in Nairobi, Kenya (East Africa Time, UTC+3).</p>
                </section>
            </aside>
        </div>
    </main>
