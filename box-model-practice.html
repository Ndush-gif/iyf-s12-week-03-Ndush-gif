<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model Practice</title>
    <link rel="stylesheet" href="style.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* This box ends up 340px wide - why? Fix it! */
    /* Fixed */
.broken-box {
    box-sizing: border-box;
    width: 300px;
    padding: 20px;
    border: none;
    background-color: lightcoral;
}
.card {
    width: 300px;
    padding: 20px;
    border: 1px solid gray;
}

.card img {
    width: 100%;
    display: block;
}

.card h3 {
    margin-bottom: 15px;
}

.card button {
    padding: 10px 20px;
    margin-top: 15px;
}
  </style>
  </head>
  <body>

    <main>
      <div class="broken-box">I should be 300px wide in total</div>
      
      <h2>Exercise 3: Card Component</h2>
<div class="card">
    <img src="https://placehold.co/300x200" alt="Placeholder card image">
    <h3>Crocheting</h3>
    <p>I enjoy making handmade pieces. It's how I relax and practice patience and creativity.</p>
    <button>See more</button>
</div>
    </main>

  </body>
</html>
